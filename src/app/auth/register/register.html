<div class="login-container">
  <mat-card class="login-card">
    <mat-card-header>
      <mat-card-title>VendorIQ</mat-card-title>
      <mat-card-subtitle>Create your account</mat-card-subtitle>
    </mat-card-header>

    <mat-card-content>
      <form (ngSubmit)="onRegister()">

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Full Name</mat-label>
          <input
            matInput
            [(ngModel)]="fullName"
            name="fullName"
            required>
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Email</mat-label>
          <input
            matInput
            type="email"
            [(ngModel)]="email"
            name="email"
            required>
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Password</mat-label>
          <input
            matInput
            type="password"
            [(ngModel)]="password"
            name="password"
            required>
        </mat-form-field>

        <button
          mat-raised-button
          color="primary"
          class="full-width"
          type="submit">
          Register
        </button>

        <p *ngIf="error" class="error-msg">
          {{ error }}
        </p>

      </form>
    </mat-card-content>

    <mat-card-actions>
      <a routerLink="/auth/login">
        Already have an account? Login
      </a>
    </mat-card-actions>

  </mat-card>
</div>
